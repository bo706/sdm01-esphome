# T6.3：公共 EMQX 8883。discovery false。不写 topic_prefix。不带本机账号。
# T8.1：连不上 Wi-Fi 时才回退热点 SDM01-Setup，配合 captive_portal。
# 按需才打开热点的做法一期只记录，不实现。
# 板内串口按电路图：GPIO0 发送，GPIO1 接收，19200、8N1。
# 绿色 RS485 的 9600 不写进 uart。
# logger baud_rate 为 0，级别 INFO。
# 证书日期检查开着，错误时间才会失败。
# Wi-Fi、API、OTA、云端 Broker 和 CA 用 !secret。这次不带 MQTT 账号。热点不设密码。
# 正向、反向电能 state_class 为 total_increasing。进出合计不写。不加 multiply。
# T8.2 只加官方空闲堆传感器。Improv 试过，空闲堆掉得太多，不加。

esphome:
  name: sdm01-meter
  comment: T6.3 emqx public 8883

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_MBEDTLS_HAVE_TIME_DATE: y

logger:
  baud_rate: 0
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "SDM01-Setup"

captive_portal:

debug:
  update_interval: 10s

mqtt:
  broker: !secret mqtt_cloud_broker
  port: 8883
  discovery: false
  certificate_authority: !secret mqtt_cloud_ca

time:
  - platform: sntp
    id: sntp_time
    servers:
      - ntp.aliyun.com

uart:
  id: modbus_uart
  tx_pin: GPIO0
  rx_pin: GPIO1
  baud_rate: 19200
  data_bits: 8
  parity: NONE
  stop_bits: 1

modbus:
  id: modbus_hub
  uart_id: modbus_uart
  role: client

modbus_controller:
  - id: meter
    address: 247
    modbus_id: modbus_hub
    update_interval: 10s

sensor:
  - platform: modbus_controller
    modbus_controller_id: meter
    name: "Voltage A"
    address: 1000
    register_type: holding
    value_type: FP32
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
  - platform: modbus_controller
    modbus_controller_id: meter
    name: "Voltage B"
    address: 1002
    register_type: holding
    value_type: FP32
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
  - platform: modbus_controller
    modbus_controller_id: meter
    name: "Voltage C"
    address: 1004
    register_type: holding
    value_type: FP32
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
  - platform: modbus_controller
    modbus_controller_id: meter
    name: "Current A"
    address: 1006
    register_type: holding
    value_type: FP32
    unit_of_measurement: A
    device_class: current
    state_class: measurement
  - platform: modbus_controller
    modbus_controller_id: meter
    name: "Current B"
    address: 1008
    register_type: holding
    value_type: FP32
    unit_of_measurement: A
    device_class: current
    state_class: measurement
  - platform: modbus_controller
    modbus_controller_id: meter
    name: "Current C"
    address: 1010
    register_type: holding
    value_type: FP32
    unit_of_measurement: A
    device_class: current
    state_class: measurement
  - platform: modbus_controller
    modbus_controller_id: meter
    name: "Active Power A"
    address: 1012
    register_type: holding
    value_type: FP32
    unit_of_measurement: kW
    device_class: power
    state_class: measurement
